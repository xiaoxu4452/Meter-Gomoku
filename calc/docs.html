<script>
/* the About page, the full manual and the quick guide are merged into
   guide.html - this stub keeps old links, bookmarks and search results working */
(function () {
  try {
    var t = localStorage.getItem('mg.site.theme') || localStorage.getItem('mgcalc.theme') || '';
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
  } catch (e) {}
  location.replace('./guide.html' + location.hash);
})();
</script>

body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);

.card{max-width:430px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-align:center}

p{margin:0 0 12px;color:var(--sub);font-size:13.5px}
a{display:inline-block;margin-top:4px;padding:9px 16px;border-radius:10px;background:var(--accent);color:#fff;

</style>
